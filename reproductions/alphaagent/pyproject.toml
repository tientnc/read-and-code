[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[project]
name = "alphaagent"
version = "0.1.0"
description = "AlphaAgent: LLM-Driven Alpha Mining with Regularized Exploration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic-settings>=2.0.0",
  "rich>=13.0.0",
  "python-Levenshtein",
  "filelock",
  "loguru",
  "fire",
  "fuzzywuzzy",
  "openai>=1.0.0",
  "scikit-learn>=1.3.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "matplotlib",
  "python-dotenv",
  "pyqlib",
]

[project.scripts]
alphaagent = "alphaagent.app.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
